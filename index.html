
<section class="admin-section" id="admin">
  <div class="section-heading">
    <span class="eyebrow">STAFF ACCESS</span>
    <h2>Admin Dashboard</h2>
    <p>Authorized staff only.</p>
  </div>

  <form id="adminLoginForm" class="review-form">
    <h3>Admin Login</h3>
    <input
      id="adminPassword"
      type="password"
      placeholder="Enter admin password"
      required
    >
    <button class="primary-btn" type="submit">Login</button>
    <p id="adminLoginMessage"></p>
  </form>

  <div id="adminDashboard" hidden>
    <h3>Welcome to the Admin Panel</h3>

    <div class="admin-stats">
      <div class="stat">
        <strong id="adminProducts">0</strong>
        <small>Products</small>
      </div>
      <div class="stat">
        <strong id="adminOrders">0</strong>
        <small>Orders</small>
      </div>
      <div class="stat">
        <strong id="adminReviews">0</strong>
        <small>Reviews</small>
      </div>
    </div>

    <form id="productForm" class="review-form">
      <h3>Add a Product</h3>
      <input id="newName" placeholder="Product name" required>
      <input id="newPrice" type="number" min="0" step="0.01" placeholder="Price" required>
      <input id="newEmoji" placeholder="Product emoji">
      <select id="newCategory">
        <option value="donations">Donations</option>
        <option value="special">Special</option>
        <option value="memberships">Memberships</option>
      </select>
      <textarea id="newDescription" placeholder="Description" required></textarea>
      <button class="primary-btn" type="submit">Add Product</button>
    </form>

    <button id="adminLogout" class="primary-btn">Logout</button>
  </div>
</section>
